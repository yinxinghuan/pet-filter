<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pet Filter Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" />
<style>
  :root {
    --paper: #EBDFC2;
    --paper-deep: #D8C49A;
    --ink: #261A0F;
    --ink-soft: #4A3621;
    --ink-fade: #7C6948;
    --ink-faint: #A48E64;
    --seal: #8A2E22;
    --paper-edge: #BAA47A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 540px; }
  body {
    background:
      radial-gradient(ellipse 130% 80% at 50% 50%,
        transparent 38%, rgba(60, 38, 16, 0.10) 78%, rgba(60, 38, 16, 0.22) 100%),
      url('/pet-filter/paper.svg');
    background-color: #EBDFC2;
    background-size: 100% 100%, 280px 380px;
    background-repeat: no-repeat, repeat;
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    position: relative;
    overflow: hidden;
  }
  /* Double-rule frame */
  .frame {
    position: absolute;
    inset: 14px;
    border: 1.4px solid var(--ink);
  }
  .frame::after {
    content: '';
    position: absolute;
    inset: 5px;
    border: 0.6px solid var(--ink);
  }
  /* Top band */
  .top {
    position: absolute;
    top: 32px; left: 0; right: 0;
    text-align: center;
    z-index: 2;
  }
  .top__house {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
    font-variant: small-caps;
  }
  .top__rule {
    width: 50%;
    margin: 12px auto 14px;
    height: 0;
    border-top: 2.4px solid var(--ink);
    position: relative;
  }
  .top__rule::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 3px;
    height: 0.6px;
    background: var(--ink);
  }
  .top__title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 64px;
    color: var(--ink);
    line-height: 1;
    margin-top: 6px;
    text-shadow:
      0 1px 0 rgba(255, 240, 210, 0.5),
      0 -0.5px 0 rgba(46, 31, 18, 0.18);
  }
  .top__sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  /* Hero plate */
  .hero {
    position: absolute;
    left: 50%;
    top: 224px;
    transform: translateX(-50%);
    width: 248px;
    height: 248px;
    background: #F4E9D0;
    border: 1.5px solid var(--ink);
    box-shadow: inset 0 0 0 5px #EBDFC2, inset 0 0 0 5.8px var(--ink);
    overflow: hidden;
    border-radius: 50%;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Bottom band */
  .bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 2;
  }
  .seal {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--seal);
    color: #F3D9CF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    box-shadow: 0 1px 0 rgba(0,0,0,0.20);
    position: relative;
  }
  .seal::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--seal) 60%, transparent 60.5%);
    z-index: -1;
  }
  .seal__top { font-size: 9px; }
  .seal__bot { font-size: 8px; font-weight: 600; letter-spacing: 0.10em; }

  .imprint {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--ink-fade);
    font-variant: small-caps;
    margin-top: 4px;
  }
  .year {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: 0.16em;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="top">
    <div class="top__house">ALTERU · Natural History</div>
    <div class="top__rule"></div>
    <h1 class="top__title">Transfiguration</h1>
    <p class="top__sub">or, How One May Be Reclassified</p>
  </div>

  <div class="hero">
    <img src="/pet-filter/demo_pet_octopus.jpg" alt="" />
  </div>

  <div class="bottom">
    <div class="seal">
      <span class="seal__top">an ·</span>
      <span class="seal__bot">MMXXVI</span>
    </div>
    <div class="imprint">A Field Guide</div>
    <div class="year">vol. I · twelve known orders</div>
  </div>
</body>
</html>
